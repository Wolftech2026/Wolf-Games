(); acc -= STEP; }\n            } else {\n                acc = 0;\n            }\n            draw();\n            if (paused) drawPausedOverlay();\n            requestAnimationFrame(gameLoop);\n        }\n\n        buildArena();\n        resetTanks();\n        draw();\n        requestAnimationFrame(gameLoop);\n\n    <\/script>\n<\/body>\n<\/html>",kok:"<!DOCTYPE html>\n<html lang=\"tr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Kökler ve Işık - Yeryüzü & 99 Dengeleme Bölümü<\/title>\n    <\u0021-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <\u0021-- Google Fonts -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n    <style>\n        * {\n            box-sizing: border-box;\n            user-select: none;\n            -webkit-user-select: none;\n        }\n        html, body {\n            margin: 0;\n            padding: 0;\n            width: 100vw;\n            height: 100vh;\n            overflow: hidden;\n            font-family: 'Lora', serif;\n            background-color: #120d0a;\n            color: #ece3d5;\n        }\n        h1, h2, h3, .font-heading {\n            font-family: 'Playfair Display', serif;\n        }\n        canvas {\n            display: block;\n            width: 100vw;\n            height: 100vh;\n            touch-action: none;\n            background-color: #140e0a;\n        }\n        /* Custom Scrollbar for 99 level grid */\n        .custom-scroll::-webkit-scrollbar {\n            width: 8px;\n        }\n        .custom-scroll::-webkit-scrollbar-track {\n            background: rgba(30, 22, 16, 0.8);\n            border-radius: 4px;\n        }\n        .custom-scroll::-webkit-scrollbar-thumb {\n            background: #6e523b;\n            border-radius: 4px;\n        }\n        .custom-scroll::-webkit-scrollbar-thumb:hover {\n            background: #997455;\n        }\n    <\/style>\n<\/head>\n<body class=\"relative w-screen h-screen overflow-hidden bg-[#140e0a] text-[#ece3d5]\">\n\n    <\u0021-- Fullscreen Canvas (Above-Ground & Subterranean Soil World) -->\n    <canvas id=\"gameCanvas\" class=\"absolute inset-0 z-0\"><\/canvas>\n\n    <\u0021-- Floating Top HUD Header -->\n    <header id=\"gameHud\" class=\"absolute top-3 left-3 right-3 z-10 flex flex-wrap items-center justify-between pointer-events-none gap-2\">\n        <\u0021-- Game Title Banner -->\n        <div class=\"bg-[#211812]/90 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-[#423123] shadow-2xl pointer-events-auto flex flex-col\">\n            <h1 class=\"text-lg sm:text-2xl font-bold font-heading text-[#f2e6d8] leading-tight\">Kökler ve Işık<\/h1>\n            <span class=\"text-[10px] sm:text-xs italic text-[#b39a82]\">Derin Ağaç & Toprak Bulmacası<\/span>\n        <\/div>\n\n        <\u0021-- Level Stats Display -->\n        <div class=\"bg-[#211812]/90 backdrop-blur-md px-3.5 py-1.5 rounded-2xl border border-[#423123] shadow-2xl pointer-events-auto flex items-center gap-2.5 sm:gap-4\">\n            <div class=\"text-center\">\n                <span class=\"block text-[9px] font-bold uppercase tracking-wider text-[#9e8671]\">Bölüm<\/span>\n                <span id=\"levelDisplay\" class=\"text-base sm:text-lg font-bold font-heading text-[#f2e6d8]\">1 / 99<\/span>\n            <\/div>\n            <div class=\"w-px h-7 bg-[#423123]\"><\/div>\n            <div class=\"text-center\">\n                <span class=\"block text-[9px] font-bold uppercase tracking-wider text-[#9e8671]\">Su Sırası<\/span>\n                <span id=\"dropsDisplay\" class=\"text-base sm:text-lg font-bold font-heading text-[#5c9bd5]\">0/3<\/span>\n            <\/div>\n            <div class=\"w-px h-7 bg-[#423123]\"><\/div>\n            <div class=\"text-center\">\n                <span class=\"block text-[9px] font-bold uppercase tracking-wider text-[#9e8671]\">Enerji / Nem<\/span>\n                <span id=\"energyDisplay\" class=\"text-base sm:text-lg font-bold font-heading text-[#d97736]\">100%<\/span>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Action Control Buttons -->\n        <div class=\"pointer-events-auto flex items-center gap-1.5\">\n            <button id=\"soundToggleBtn\" title=\"Sesi Aç/Kapat\" class=\"px-2.5 py-1.5 bg-[#211812]/90 hover:bg-[#33261c] text-[#ece3d5] text-xs font-semibold rounded-xl border border-[#423123] shadow-lg transition cursor-pointer backdrop-blur-md\">\n                🔊\n            <\/button>\n            <button id=\"restartBtn\" title=\"Tekrar Dene\" class=\"px-3 py-1.5 bg-[#211812]/90 hover:bg-[#33261c] text-[#ece3d5] text-xs font-semibold rounded-xl border border-[#423123] shadow-lg transition cursor-pointer backdrop-blur-md\">\n                🔄 Tekrar\n            <\/button>\n            <button id=\"openMenuBtn\" title=\"Bölüm Menüsü\" class=\"px-3 py-1.5 bg-[#455e37] hover:bg-[#344729] text-[#f2e6d8] text-xs font-semibold rounded-xl shadow-lg transition cursor-pointer border border-[#5d7a4b]\">\n                ≡ Menü\n            <\/button>\n        <\/div>\n    <\/header>\n\n    <\u0021-- Legend Panel (Bottom Left) -->\n    <div id=\"gameLegend\" class=\"absolute bottom-3 left-3 z-10 bg-[#211812]/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-[#423123] shadow-xl text-[11px] text-[#b8a695] hidden md:flex flex-wrap items-center gap-3 pointer-events-auto\">\n        <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded-full bg-[#5c823f] border border-[#85ad60] inline-block\"><\/span> Canlı Kök<\/span>\n        <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded-full bg-[#3978b5] border border-[#6ea0d4] inline-block\"><\/span> Sıralı Su Birikintisi<\/span>\n        <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded-full bg-[#403c38] border border-[#69635e] inline-block\"><\/span> Sert Kaya<\/span>\n        <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded-full bg-[#ad5428] inline-block\"><\/span> Kurutan Kil<\/span>\n        <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded-full bg-[#758739] border border-[#95ab4b] inline-block\"><\/span> Asitli Toprak<\/span>\n    <\/div>\n\n    <\u0021-- Fullscreen Level Menu & Dialog Modal Overlay -->\n    <div id=\"overlay\" class=\"absolute inset-0 z-20 bg-[#120d0a]/95 backdrop-blur-xl flex flex-col items-center justify-between p-3 sm:p-6 transition-opacity duration-300\">\n        \n        <\u0021-- Header Info -->\n        <div class=\"text-center max-w-xl mt-1 sm:mt-2\">\n            <h2 id=\"overlayTitle\" class=\"text-2xl sm:text-3xl font-extrabold font-heading text-[#f2e6d8] mb-1\">Bölüm Seçimi<\/h2>\n            <p id=\"overlayDesc\" class=\"text-xs sm:text-sm text-[#b39a82] max-w-md mx-auto\">\n                1'den 99'a kadar dengelenmiş bölümleri keşfedin. Köklerinizi uzatarak su birikintilerini sırasıyla toplayın ve ağacı büyütün!\n            <\/p>\n        <\/div>\n\n        <\u0021-- 1-99 Square Card Level Grid -->\n        <div class=\"w-full max-w-5xl my-2 flex-1 overflow-hidden flex flex-col justify-center\">\n            <div id=\"levelSelectGrid\" class=\"custom-scroll grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 max-h-[62vh] sm:max-h-[68vh] overflow-y-auto p-2 border border-[#423123] rounded-2xl bg-[#1c140e]/80 shadow-inner\">\n                <\u0021-- 99 square level cards injected dynamically -->\n            <\/div>\n        <\/div>\n\n        <\u0021-- Footer Action Buttons -->\n        <div class=\"flex items-center justify-center gap-3 mb-1 sm:mb-2 flex-wrap\">\n            <button id=\"actionBtn\" class=\"px-7 py-2.5 bg-[#455e37] hover:bg-[#344729] text-[#f2e6d8] font-heading font-bold text-xs sm:text-sm rounded-xl shadow-xl transition cursor-pointer border border-[#5d7a4b]\">\n                Bölüme Başla\n            <\/button>\n            <button id=\"showLevelSelectBtn\" class=\"px-5 py-2.5 bg-[#2e2118] hover:bg-[#3e2e22] text-[#ece3d5] font-heading font-bold text-xs sm:text-sm rounded-xl border border-[#4f3c2c] shadow-md transition cursor-pointer\">\n                Bölüm Menüsü (1-99)\n            <\/button>\n        <\/div>\n    <\/div>\n\n    <script>\n        // Organic Web Audio Synthesizer\n        class AudioSynth {\n            constructor() {\n                this.ctx = null;\n                this.muted = false;\n            }\n\n            init() {\n                if (!this.ctx) {\n                    const AudioContext = window.AudioContext || window.webkitAudioContext;\n                    this.ctx = new AudioContext();\n                }\n            }\n\n            playGrowthSound() {\n                if (this.muted) return;\n                this.init();\n                const osc = this.ctx.createOscillator();\n                const gain = this.ctx.createGain();\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(100 + Math.random() * 25, this.ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(180 + Math.random() * 35, this.ctx.currentTime + 0.1);\n                \n                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);\n\n                osc.connect(gain);\n                gain.connect(this.ctx.destination);\n                osc.start();\n                osc.stop(this.ctx.currentTime + 0.1);\n            }\n\n            playWaterSplashSound() {\n                if (this.muted) return;\n                this.init();\n                const osc = this.ctx.createOscillator();\n                const gain = this.ctx.createGain();\n                osc.type = 'triangle';\n                osc.frequency.setValueAtTime(320, this.ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.25);\n                \n                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);\n\n                osc.connect(gain);\n                gain.connect(this.ctx.destination);\n                osc.start();\n                osc.stop(this.ctx.currentTime + 0.25);\n            }\n\n            playDrainSound() {\n                if (this.muted) return;\n                this.init();\n                const osc = this.ctx.createOscillator();\n                const gain = this.ctx.createGain();\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(130, this.ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.16);\n                \n                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);\n\n                osc.connect(gain);\n                gain.connect(this.ctx.destination);\n                osc.start();\n                osc.stop(this.ctx.currentTime + 0.16);\n            }\n\n            playToxicSound() {\n                if (this.muted) return;\n                this.init();\n                const osc = this.ctx.createOscillator();\n                const gain = this.ctx.createGain();\n                osc.type = 'square';\n                osc.frequency.setValueAtTime(180, this.ctx.currentTime);\n                osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.18);\n                \n                gain.gain.setValueAtTime(0.06, this.ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);\n\n                osc.connect(gain);\n                gain.connect(this.ctx.destination);\n                osc.start();\n                osc.stop(this.ctx.currentTime + 0.18);\n            }\n\n            playWinSound() {\n                if (this.muted) return;\n                this.init();\n                const notes = [220, 277.18, 329.63, 440, 554.37, 659.25];\n                notes.forEach((freq, idx) => {\n                    const osc = this.ctx.createOscillator();\n                    const gain = this.ctx.createGain();\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);\n                    \n                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);\n                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);\n\n                    osc.connect(gain);\n                    gain.connect(this.ctx.destination);\n                    osc.start(this.ctx.currentTime + idx * 0.08);\n                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);\n                });\n            }\n        }\n\n        const sound = new AudioSynth();\n\n        // Canvas Setup\n        const canvas = document.getElementById('gameCanvas');\n        const ctx = canvas.getContext('2d');\n\n        // UI Handles\n        const levelDisplay = document.getElementById('levelDisplay');\n        const dropsDisplay = document.getElementById('dropsDisplay');\n        const energyDisplay = document.getElementById('energyDisplay');\n        const overlay = document.getElementById('overlay');\n        const overlayTitle = document.getElementById('overlayTitle');\n        const overlayDesc = document.getElementById('overlayDesc');\n        const actionBtn = document.getElementById('actionBtn');\n        const showLevelSelectBtn = document.getElementById('showLevelSelectBtn');\n        const levelSelectGrid = document.getElementById('levelSelectGrid');\n        const restartBtn = document.getElementById('restartBtn');\n        const openMenuBtn = document.getElementById('openMenuBtn');\n        const soundToggleBtn = document.getElementById('soundToggleBtn');\n\n        // State Tracking\n        let currentLevel = 0; // 0 to 98\n        let unlockedLevels = parseInt(localStorage.getItem('kokler_unlocked_99_v4') || '1');\n        let levelStars = JSON.parse(localStorage.getItem('kokler_stars_99_v4') || '{}');\n\n        let currentTargetIndex = 0;\n        let totalTargetCount = 0;\n        let energy = 100;\n        let startingEnergy = 100;\n        let gameState = 'LEVEL_SELECT';\n\n        let surfaceY = 0; // Surface level separating sky from soil\n        let treePosition = { x: 0, y: 0 };\n        let treeBloomFactor = 0.0; // 0.0 (bare) to 1.0 (lush blooming canopy)\n\n        let roots = [];\n        let waterPools = [];\n        let rockObstacles = [];\n        let dryClayZones = [];\n        let toxicZones = [];\n\n        let isDragging = false;\n        let dragCurrent = { x: 0, y: 0 };\n        let activeRootTip = null;\n\n        // Background Soil Canvas Cache\n        let bgCanvas = document.createElement('canvas');\n        let bgCtx = bgCanvas.getContext('2d');\n\n        function resizeCanvas() {\n            canvas.width = window.innerWidth;\n            canvas.height = window.innerHeight;\n            surfaceY = Math.max(120, canvas.height * 0.22); // Top 22% for Above-Ground Yeryüzü\n            treePosition = { x: canvas.width / 2, y: surfaceY };\n            generateBackgroundSoilTexture();\n        }\n        window.addEventListener('resize', resizeCanvas);\n\n        // Pre-render Earth & Above-Ground Sky\n        function generateBackgroundSoilTexture() {\n            bgCanvas.width = canvas.width;\n            bgCanvas.height = canvas.height;\n\n            const w = bgCanvas.width;\n            const h = bgCanvas.height;\n\n            // 1. ABOVE-GROUND SKY\n            const skyGrad = bgCtx.createLinearGradient(0, 0, 0, surfaceY);\n            skyGrad.addColorStop(0, '#594433');   // Warm parchment atmosphere\n            skyGrad.addColorStop(0.6, '#8c6b4f'); // Horizon dusk\n            skyGrad.addColorStop(1, '#b5926c');   // Golden horizon glow\n            bgCtx.fillStyle = skyGrad;\n            bgCtx.fillRect(0, 0, w, surfaceY);\n\n            // Sun / Light Glow\n            const sunGrad = bgCtx.createRadialGradient(w * 0.75, surfaceY * 0.35, 10, w * 0.75, surfaceY * 0.35, 120);\n            sunGrad.addColorStop(0, 'rgba(247, 226, 178, 0.75)');\n            sunGrad.addColorStop(1, 'rgba(247, 226, 178, 0)');\n            bgCtx.fillStyle = sunGrad;\n            bgCtx.beginPath();\n            bgCtx.arc(w * 0.75, surfaceY * 0.35, 120, 0, Math.PI * 2);\n            bgCtx.fill();\n\n            // Clouds\n            bgCtx.fillStyle = 'rgba(235, 215, 190, 0.18)';\n            bgCtx.beginPath();\n            bgCtx.arc(w * 0.2, surfaceY * 0.3, 35, 0, Math.PI * 2);\n            bgCtx.arc(w * 0.24, surfaceY * 0.25, 45, 0, Math.PI * 2);\n            bgCtx.arc(w * 0.28, surfaceY * 0.3, 30, 0, Math.PI * 2);\n            bgCtx.fill();\n\n            // 2. SURFACE BOUNDARY LINE & GRASS\n            const grassGrad = bgCtx.createLinearGradient(0, surfaceY - 12, 0, surfaceY + 8);\n            grassGrad.addColorStop(0, '#526938');\n            grassGrad.addColorStop(0.5, '#3b4d27');\n            grassGrad.addColorStop(1, '#2b2017');\n            bgCtx.fillStyle = grassGrad;\n            bgCtx.fillRect(0, surfaceY - 10, w, 20);\n\n            // Grass Blades\n            bgCtx.strokeStyle = '#6e8c4a';\n            bgCtx.lineWidth = 1.8;\n            for (let gx = 0; gx < w; gx += 6) {\n                let bladeH = 6 + Math.sin(gx * 0.1) * 5;\n                bgCtx.beginPath();\n                bgCtx.moveTo(gx, surfaceY);\n                bgCtx.lineTo(gx + Math.sin(gx) * 4, surfaceY - bladeH);\n                bgCtx.stroke();\n            }\n\n            // 3. UNDERGROUND EARTH STRATA\n            const soilGrad = bgCtx.createLinearGradient(0, surfaceY, 0, h);\n            soilGrad.addColorStop(0, '#2b1f17');     // Topsoil\n            soilGrad.addColorStop(0.2, '#211711');    // Humus\n            soilGrad.addColorStop(0.55, '#17100b');   // Clay & Gravel\n            soilGrad.addColorStop(1.0, '#0a0705');    // Bedrock\n            bgCtx.fillStyle = soilGrad;\n            bgCtx.fillRect(0, surfaceY, w, h - surfaceY);\n\n            // Strata Lines\n            bgCtx.strokeStyle = 'rgba(64, 45, 32, 0.35)';\n            bgCtx.lineWidth = 2.5;\n            for (let y = surfaceY + 30; y < h; y += 30) {\n                bgCtx.beginPath();\n                bgCtx.moveTo(0, y);\n                for (let x = 0; x < w; x += 35) {\n                    bgCtx.lineTo(x, y + Math.sin(x * 0.03 + y) * 7);\n                }\n                bgCtx.stroke();\n            }\n\n            // Dirt Particles\n            let noiseSeed = 12345;\n            const randNoise = () => {\n                let x = Math.sin(noiseSeed++) * 10000;\n                return x - Math.floor(x);\n            };\n\n            const particleCount = Math.floor((w * (h - surfaceY)) / 1500);\n            for (let i = 0; i < particleCount; i++) {\n                let px = randNoise() * w;\n                let py = surfaceY + randNoise() * (h - surfaceY);\n                let pr = 0.8 + randNoise() * 2.2;\n                let shade = Math.floor(randNoise() * 50);\n\n                bgCtx.fillStyle = `rgba(${55 + shade}, ${38 + shade}, ${26 + shade}, ${0.35 + randNoise() * 0.4})`;\n                bgCtx.beginPath();\n                bgCtx.arc(px, py, pr, 0, Math.PI * 2);\n                bgCtx.fill();\n            }\n        }\n\n        function pseudoRandom(seedVal) {\n            let x = Math.sin(seedVal++) * 10000;\n            return x - Math.floor(x);\n        }\n\n        // Procedural Level Generator (Slightly Relaxed & Balanced for Fun Play)\n        function generateLevelConfig(levelIndex) {\n            const levelNum = levelIndex + 1;\n            let randSeed = levelNum * 1337 + 4321;\n            const rand = () => pseudoRandom(randSeed++);\n\n            const width = canvas.width || window.innerWidth;\n            const height = canvas.height || window.innerHeight;\n\n            const diffRatio = levelIndex / 98; // 0.0 to 1.0\n\n            // BALANCED ENERGY BUDGET: +25% extra buffer so players can make small adjustments\n            const baseEnergy = Math.max(38, Math.floor(100 - diffRatio * 52));\n\n            // Water Target Count\n            const dropCount = Math.min(5, 3 + Math.floor(diffRatio * 2.5));\n\n            const undergroundYMin = surfaceY + 90;\n            const undergroundYMax = height - 60;\n            const minX = 70;\n            const maxX = width - 70;\n\n            // Sequenced Water Pools\n            const generatedPools = [];\n            for (let i = 0; i < dropCount; i++) {\n                let wx = minX + rand() * (maxX - minX);\n                let wy = undergroundYMin + (i + 0.5) * ((undergroundYMax - undergroundYMin) / dropCount) + (rand() - 0.5) * 30;\n                \n                // Gentler Moving Currents\n                let isMoving = levelNum >= 3 && rand() < (0.25 + diffRatio * 0.5);\n                let moveX = isMoving && rand() > 0.4 ? 30 + rand() * (50 + diffRatio * 50) : 0;\n                let moveY = isMoving && moveX === 0 ? 25 + rand() * (40 + diffRatio * 40) : 0;\n                let speed = 0.012 + rand() * (0.018 + diffRatio * 0.02); // Slower speed for easier timing\n\n                let points = [];\n                let pointCount = 7 + Math.floor(rand() * 4);\n                let baseRadius = 16 + rand() * 6; // Slightly larger target touch size\n                for (let pt = 0; pt < pointCount; pt++) {\n                    let angle = (pt / pointCount) * Math.PI * 2;\n                    let varR = baseRadius * (0.8 + rand() * 0.4);\n                    points.push({ angle, varR });\n                }\n\n                generatedPools.push({\n                    order: i + 1, // Collected in strict sequence\n                    x: wx,\n                    y: wy,\n                    radius: baseRadius,\n                    points: points,\n                    moveX: moveX,\n                    moveY: moveY,\n                    speed: speed\n                });\n            }\n\n            // Balanced Rock Barriers\n            const rockCount = Math.floor(3 + diffRatio * 18);\n            const generatedRocks = [];\n            for (let i = 0; i < rockCount; i++) {\n                let rx = 60 + rand() * (width - 120);\n                let ry = surfaceY + 70 + rand() * (height - surfaceY - 110);\n                let radius = 18 + rand() * (20 + diffRatio * 22);\n\n                // Ensure initial tree root path is clear\n                if (Math.hypot(rx - treePosition.x, ry - (surfaceY + 15)) > radius + 45) {\n                    generatedRocks.push({ x: rx, y: ry, radius: radius });\n                }\n            }\n\n            // Absorptive Dry Clay Zones\n            const dryCount = levelNum < 2 ? 0 : Math.floor(1 + diffRatio * 5);\n            const generatedDryZones = [];\n            for (let i = 0; i < dryCount; i++) {\n                let dx = 70 + rand() * (width - 140);\n                let dy = surfaceY + 80 + rand() * (height - surfaceY - 120);\n                let radius = 24 + rand() * (28 + diffRatio * 20);\n                generatedDryZones.push({ x: dx, y: dy, radius: radius });\n            }\n\n            // Toxic Acidic Soil Zones\n            const toxicCount = levelNum < 4 ? 0 : Math.floor(1 + diffRatio * 5);\n            const generatedToxicZones = [];\n            for (let i = 0; i < toxicCount; i++) {\n                let tx = 80 + rand() * (width - 160);\n                let ty = surfaceY + 90 + rand() * (height - surfaceY - 130);\n                let radius = 22 + rand() * 26;\n                generatedToxicZones.push({ x: tx, y: ty, radius: radius });\n            }\n\n            return {\n                levelNum: levelNum,\n                energy: baseEnergy,\n                waterPools: generatedPools,\n                rockObstacles: generatedRocks,\n                dryClayZones: generatedDryZones,\n                toxicZones: generatedToxicZones\n            };\n        }\n\n        function initLevel(lvlIndex) {\n            if (lvlIndex < 0) lvlIndex = 0;\n            if (lvlIndex >= 99) lvlIndex = 98;\n\n            currentLevel = lvlIndex;\n            let config = generateLevelConfig(currentLevel);\n\n            totalTargetCount = config.waterPools.length;\n            currentTargetIndex = 0;\n            startingEnergy = config.energy;\n            energy = config.energy;\n            treeBloomFactor = 0.0;\n\n            waterPools = config.waterPools.map(w => ({\n                ...w,\n                baseX: w.x,\n                baseY: w.y,\n                collected: false\n            }));\n\n            rockObstacles = config.rockObstacles.map(r => ({ ...r }));\n            dryClayZones = config.dryClayZones.map(d => ({ ...d }));\n            toxicZones = config.toxicZones.map(t => ({ ...t }));\n\n            // Root starting node at tree base\n            roots = [{\n                x: treePosition.x,\n                y: surfaceY + 12,\n                parent: null,\n                children: [],\n                radius: 8.5,\n                active: true,\n                length: 0\n            }];\n\n            updateUI();\n            gameState = 'PLAYING';\n            overlay.classList.add('opacity-0', 'pointer-events-none');\n        }\n\n        function updateUI() {\n            levelDisplay.textContent = `${currentLevel + 1} / 99`;\n            dropsDisplay.textContent = `${currentTargetIndex}/${totalTargetCount}`;\n            energyDisplay.textContent = `${Math.max(0, Math.round(energy))}%`;\n        }\n\n        function calculateStars() {\n            let ratio = energy / startingEnergy;\n            if (ratio >= 0.30) return 3;\n            if (ratio >= 0.10) return 2;\n            return 1;\n        }\n\n        // Render Square Card Level Selection Grid (1 to 99)\n        function renderLevelSelect(title = \"Bölüm Seçimi\", desc = \"1'den 99'a kadar bölümleri tamamlayın. Su birikintilerini doğru sırayla toplayarak ağacı yaşatın!\") {\n            gameState = 'LEVEL_SELECT';\n            overlayTitle.textContent = title;\n            overlayDesc.textContent = desc;\n            actionBtn.style.display = 'none';\n            levelSelectGrid.innerHTML = '';\n\n            for (let i = 0; i < 99; i++) {\n                const isUnlocked = i < unlockedLevels;\n                const stars = levelStars[i] || 0;\n\n                const card = document.createElement('button');\n                card.className = `aspect-square p-1 sm:p-2 rounded-xl font-heading font-bold text-xs sm:text-sm border transition flex flex-col items-center justify-between shadow-md ${\n                    isUnlocked \n                        ? 'bg-[#2b1f17] border-[#5e4531] text-[#f2e6d8] hover:bg-[#455e37] hover:border-[#81a867] cursor-pointer hover:scale-105 transform duration-150' \n                        : 'bg-[#1a130d]/80 border-[#33251a] text-[#695444] cursor-not-allowed opacity-60'\n                }`;\n\n                let starStr = isUnlocked \n                    ? (stars > 0 ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '☆☆☆') \n                    : '🔒';\n\n                card.innerHTML = `\n                    <span class=\"text-[8px] sm:text-[9px] uppercase tracking-wider text-[#9e8671]\">BÖLÜM<\/span>\n                    <span class=\"text-sm sm:text-lg font-black font-heading leading-none my-0.5\">${i + 1}<\/span>\n                    <span class=\"text-[9px] sm:text-xs ${isUnlocked ? 'text-[#d97736]' : 'text-[#695444]'}\">${starStr}<\/span>\n                `;\n\n                if (isUnlocked) {\n                    card.addEventListener('click', () => {\n                        initLevel(i);\n                    });\n                }\n                levelSelectGrid.appendChild(card);\n            }\n\n            overlay.classList.remove('opacity-0', 'pointer-events-none');\n        }\n\n        function showStatusOverlay(title, desc, btnText) {\n            overlayTitle.textContent = title;\n            overlayDesc.textContent = desc;\n            actionBtn.textContent = btnText;\n            actionBtn.style.display = 'inline-block';\n            levelSelectGrid.innerHTML = '';\n            overlay.classList.remove('opacity-0', 'pointer-events-none');\n        }\n\n        // Pointer Logic for Dragging Root Tips\n        function getCanvasPos(e) {\n            const rect = canvas.getBoundingClientRect();\n            return {\n                x: e.clientX - rect.left,\n                y: e.clientY - rect.top\n            };\n        }\n\n        canvas.addEventListener('pointerdown', (e) => {\n            if (gameState !== 'PLAYING') return;\n            const pos = getCanvasPos(e);\n\n            if (pos.y < surfaceY) return;\n\n            let activeTips = roots.filter(r => r.active);\n            if (activeTips.length === 0) return;\n\n            let closest = activeTips[0];\n            let minDist = Math.hypot(closest.x - pos.x, closest.y - pos.y);\n            for (let t of activeTips) {\n                let dist = Math.hypot(t.x - pos.x, t.y - pos.y);\n                if (dist < minDist) {\n                    minDist = dist;\n                    closest = t;\n                }\n            }\n\n            if (minDist < 120) {\n                isDragging = true;\n                activeRootTip = closest;\n                dragCurrent = pos;\n            }\n        });\n\n        canvas.addEventListener('pointermove', (e) => {\n            if (!isDragging || gameState !== 'PLAYING') return;\n            dragCurrent = getCanvasPos(e);\n        });\n\n        window.addEventListener('pointerup', () => {\n            if (!isDragging || gameState !== 'PLAYING' || !activeRootTip) {\n                isDragging = false;\n                activeRootTip = null;\n                return;\n            }\n\n            let dx = dragCurrent.x - activeRootTip.x;\n            let dy = dragCurrent.y - activeRootTip.y;\n            let dist = Math.hypot(dx, dy);\n\n            if (dragCurrent.y < surfaceY + 10) {\n                isDragging = false;\n                activeRootTip = null;\n                return;\n            }\n\n            if (dist > 12 && dist < 140 && energy > 0.5) {\n                let angle = Math.atan2(dy, dx);\n                let stepLen = Math.min(dist, 50);\n                let newX = activeRootTip.x + Math.cos(angle) * stepLen;\n                let newY = activeRootTip.y + Math.sin(angle) * stepLen;\n\n                if (newX > 15 && newX < canvas.width - 15 && newY > surfaceY + 12 && newY < canvas.height - 15) {\n                    \n                    // Collision check with bedrock\n                    let hitRock = rockObstacles.some(rock => Math.hypot(rock.x - newX, rock.y - newY) < rock.radius + 4);\n\n                    if (!hitRock) {\n                        activeRootTip.active = false;\n\n                        let taperedRadius = Math.max(1.8, activeRootTip.radius * 0.88);\n\n                        let newRootNode = {\n                            x: newX,\n                            y: newY,\n                            parent: activeRootTip,\n                            children: [],\n                            radius: taperedRadius,\n                            active: true,\n                            length: activeRootTip.length + 1\n                        };\n\n                        activeRootTip.children.push(newRootNode);\n                        roots.push(newRootNode);\n\n                        sound.playGrowthSound();\n\n                        // BALANCED ENERGY COST: 4 per standard growth step\n                        let cost = 4;\n\n                        // Softened Dry Clay Penalty (+8)\n                        dryClayZones.forEach(d => {\n                            if (Math.hypot(d.x - newX, d.y - newY) < d.radius + 6) {\n                                cost += 8;\n                                sound.playDrainSound();\n                            }\n                        });\n\n                        // Softened Toxic Acid Penalty (+12)\n                        toxicZones.forEach(t => {\n                            if (Math.hypot(t.x - newX, t.y - newY) < t.radius + 6) {\n                                cost += 12;\n                                sound.playToxicSound();\n                            }\n                        });\n\n                        energy -= cost;\n\n                        // Sequenced Water Collection\n                        let targetPool = waterPools.find(w => w.order === currentTargetIndex + 1);\n\n                        if (targetPool && !targetPool.collected) {\n                            if (Math.hypot(targetPool.x - newX, targetPool.y - newY) < targetPool.radius + 16) {\n                                targetPool.collected = true;\n                                currentTargetIndex++;\n                                energy = Math.min(startingEnergy, energy + 35); // Generous moisture gain\n                                treeBloomFactor = currentTargetIndex / totalTargetCount;\n                                sound.playWaterSplashSound();\n\n                                // Allow extra branching tip at pool\n                                roots.push({\n                                    x: newX,\n                                    y: newY,\n                                    parent: newRootNode,\n                                    children: [],\n                                    radius: 4.5,\n                                    active: true,\n                                    length: newRootNode.length + 1\n                                });\n                            }\n                        }\n\n                        updateUI();\n\n                        // Win Condition\n                        if (currentTargetIndex >= totalTargetCount) {\n                            gameState = 'LEVEL_WON';\n                            let earnedStars = calculateStars();\n                            \n                            if (!levelStars[currentLevel] || earnedStars > levelStars[currentLevel]) {\n                                levelStars[currentLevel] = earnedStars;\n                                localStorage.setItem('kokler_stars_99_v4', JSON.stringify(levelStars));\n                            }\n\n                            if (currentLevel + 1 >= unlockedLevels && unlockedLevels < 99) {\n                                unlockedLevels = currentLevel + 2;\n                                localStorage.setItem('kokler_unlocked_99_v4', unlockedLevels.toString());\n                            }\n\n                            sound.playWinSound();\n                            setTimeout(() => {\n                                showStatusOverlay(\n                                    `Bölüm ${currentLevel + 1} Tamamlandı!`,\n                                    `Ağaç yeşerdi ve tüm su kaynakları sırasıyla toplandı! Derece: ${'★'.repeat(earnedStars)}${'☆'.repeat(3 - earnedStars)}`,\n                                    currentLevel + 1 < 99 ? \"Sonraki Bölüm\" : \"Bölüm Menüsü (1-99)\"\n                                );\n                            }, 300);\n                        }\n\n                        // Game Over Condition\n                        if (energy <= 0 && currentTargetIndex < totalTargetCount) {\n                            gameState = 'GAME_OVER';\n                            sound.playDrainSound();\n                            showStatusOverlay(\"Ağaç Kurudu!\", \"Enerji bitti. Farklı bir rota deneyerek su kaynaklarını sırayla toplamayı deneyin.\", \"Tekrar Dene\");\n                        }\n                    }\n                }\n            }\n\n            isDragging = false;\n            activeRootTip = null;\n        });\n\n        // UI Event Listeners\n        actionBtn.addEventListener('click', () => {\n            if (gameState === 'GAME_OVER') {\n                initLevel(currentLevel);\n            } else if (gameState === 'LEVEL_WON') {\n                if (currentLevel + 1 < 99) {\n                    initLevel(currentLevel + 1);\n                } else {\n                    renderLevelSelect();\n                }\n            }\n        });\n\n        showLevelSelectBtn.addEventListener('click', () => {\n            renderLevelSelect();\n        });\n\n        openMenuBtn.addEventListener('click', () => {\n            renderLevelSelect();\n        });\n\n        restartBtn.addEventListener('click', () => {\n            initLevel(currentLevel);\n        });\n\n        soundToggleBtn.addEventListener('click', () => {\n            sound.muted = !sound.muted;\n            soundToggleBtn.textContent = sound.muted ? \"🔇\" : \"🔊\";\n        });\n\n        // Above-Ground Tree Render Function\n        function drawTree(x, y, bloomFactor, time) {\n            ctx.save();\n            ctx.translate(x, y);\n\n            // Trunk\n            ctx.fillStyle = '#2e2016';\n            ctx.beginPath();\n            ctx.moveTo(-10, 0);\n            ctx.lineTo(-6, -45);\n            ctx.lineTo(6, -45);\n            ctx.lineTo(10, 0);\n            ctx.fill();\n\n            // Branches\n            ctx.strokeStyle = '#2e2016';\n            ctx.lineWidth = 4;\n            ctx.beginPath();\n            ctx.moveTo(0, -40);\n            ctx.lineTo(-22, -70);\n            ctx.moveTo(0, -40);\n            ctx.lineTo(22, -72);\n            ctx.moveTo(0, -45);\n            ctx.lineTo(0, -85);\n            ctx.stroke();\n\n            // Foliage Canopy\n            let sway = Math.sin(time * 2) * 3;\n            let foliageRadius = 18 + bloomFactor * 24;\n\n            ctx.fillStyle = `rgba(${55 + bloomFactor * 40}, ${90 + bloomFactor * 70}, ${35 + bloomFactor * 30}, 0.9)`;\n            ctx.beginPath();\n            ctx.arc(-22 + sway, -75, foliageRadius, 0, Math.PI * 2);\n            ctx.arc(22 + sway, -77, foliageRadius, 0, Math.PI * 2);\n            ctx.arc(0 + sway, -90, foliageRadius * 1.15, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Blossom Highlights\n            if (bloomFactor > 0.3) {\n                ctx.fillStyle = '#e69a4e';\n                for (let i = 0; i < 5; i++) {\n                    let fx = Math.sin(i * 1.5) * 22 + sway;\n                    let fy = -75 + Math.cos(i * 1.5) * 18;\n                    ctx.beginPath();\n                    ctx.arc(fx, fy, 3.5, 0, Math.PI * 2);\n                    ctx.fill();\n                }\n            }\n\n            ctx.restore();\n        }\n\n        // Main Render Loop\n        function draw() {\n            // Background\n            ctx.drawImage(bgCanvas, 0, 0);\n\n            let time = Date.now() * 0.001;\n\n            // Render Tree\n            drawTree(treePosition.x, treePosition.y, treeBloomFactor, time);\n\n            // Dry Clay\n            dryClayZones.forEach(d => {\n                ctx.fillStyle = 'rgba(173, 84, 40, 0.28)';\n                ctx.beginPath();\n                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);\n                ctx.fill();\n\n                ctx.strokeStyle = 'rgba(173, 84, 40, 0.65)';\n                ctx.lineWidth = 1.8;\n                ctx.setLineDash([4, 4]);\n                ctx.stroke();\n                ctx.setLineDash([]);\n            });\n\n            // Toxic Acidic Soil\n            toxicZones.forEach(t => {\n                ctx.fillStyle = 'rgba(117, 135, 57, 0.28)';\n                ctx.beginPath();\n                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);\n                ctx.fill();\n\n                ctx.strokeStyle = 'rgba(149, 171, 75, 0.6)';\n                ctx.lineWidth = 1.8;\n                ctx.stroke();\n            });\n\n            // Rocks\n            rockObstacles.forEach(rock => {\n                const grad = ctx.createRadialGradient(\n                    rock.x - rock.radius * 0.3, rock.y - rock.radius * 0.3, rock.radius * 0.1,\n                    rock.x, rock.y, rock.radius\n                );\n                grad.addColorStop(0, '#5e5853');\n                grad.addColorStop(0.7, '#38332f');\n                grad.addColorStop(1, '#211d1a');\n\n                ctx.fillStyle = grad;\n                ctx.beginPath();\n                ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);\n                ctx.fill();\n\n                ctx.strokeStyle = '#171412';\n                ctx.lineWidth = 2;\n                ctx.stroke();\n            });\n\n            // Sequenced Water Pools\n            waterPools.forEach(w => {\n                if (!w.collected) {\n                    if (w.moveX) w.x = w.baseX + Math.sin(time * (w.speed || 0.015) * 50) * w.moveX;\n                    if (w.moveY) w.y = w.baseY + Math.cos(time * (w.speed || 0.015) * 50) * w.moveY;\n\n                    ctx.save();\n                    ctx.translate(w.x, w.y);\n\n                    ctx.beginPath();\n                    for (let ptIdx = 0; ptIdx < w.points.length; ptIdx++) {\n                        let pt = w.points[ptIdx];\n                        let ripple = Math.sin(time * 3 + ptIdx) * 1.6;\n                        let r = pt.varR + ripple;\n                        let px = Math.cos(pt.angle) * r;\n                        let py = Math.sin(pt.angle) * r;\n                        if (ptIdx === 0) ctx.moveTo(px, py);\n                        else ctx.lineTo(px, py);\n                    }\n                    ctx.closePath();\n\n                    const isNextTarget = w.order === currentTargetIndex + 1;\n\n                    const waterGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, w.radius * 1.2);\n andom()*COL.length)],pref:Math.random()<.5?1:-1,cc:Array.from({length:30},()=>Math.floor(Math.random()*7)),sink:null,entered:false,lit:false,tr:[],tt:0});\n}\nfunction crash(s,msg,rock){\n  s.sink=1.4;lost++;if(rock)rock.seen=99;if(lost>=3){state='crash';crashT=1.5;crashMsg=msg;}\n}\nfunction update(dt){\n  const m=mode(),tl=(2.4+.45*S.up.turn)*dt;\n  beamA+=Math.max(-tl,Math.min(tl,nd(Math.atan2(my-CY,mx-CX)-beamA)));\n  windT-=dt;\n  if(windT<=0){windT=rnd(8,14);wind.ta=rnd(0,6.283);wind.s=rnd(p.wind*.6,p.wind*1.2);}\n  wind.a+=nd(wind.ta-wind.a)*dt*.4;\n  spawn-=dt;\n  if(spawn<=0){spawn=p.gap*rnd(.8,1.2);if(ships.length<p.max)addShip();}\n  const mem=2.5+.8*S.up.memory,pil=1+.12*S.up.pilot;\n  for(const r of rocks){r.seen=Math.max(0,r.seen-dt);if(lit(r.x,r.y,m))r.seen=mem;}\n  for(const s of ships){\n    if(s.sink!==null){s.sink-=dt;if(s.sink<=0)s.gone=true;continue;}\n    s.lit=lit(s.x,s.y,m);\n    if(s.lit){\n      let dx=CX-s.x,dy=CY-s.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;\n      let ax=dx,ay=dy;const look=s.L*s.size*.5+90;\n      for(const o of rocks.concat(land)){\n        const ox=o.x-s.x,oy=o.y-s.y;\n        if(ox*dx+oy*dy<-o.r)continue;\n        const dist=Math.hypot(ox,oy)-o.r;\n        if(dist>look)continue;\n        const perp=-ox*dy+oy*dx;\n        if(Math.abs(perp)>o.r+s.hr+16)continue;\n        const side=Math.abs(perp)<6?s.pref:(perp>0?-1:1);\n        const w=2*(1-Math.max(0,dist)/look)+.5;\n        ax+=-dy*side*w;ay+=dx*side*w;\n      }\n      const al=Math.hypot(ax,ay)||1;\n      const tx=ax/al*s.spd-Math.cos(wind.a)*wind.s*s.wnd,ty=ay/al*s.spd-Math.sin(wind.a)*wind.s*s.wnd;\n      const lim=s.trn*pil*dt;\n      s.h+=Math.max(-lim,Math.min(lim,nd(Math.atan2(ty,tx)-s.h)));\n    }\n    s.x+=(Math.cos(s.h)*s.spd+Math.cos(wind.a)*wind.s*s.wnd)*dt;\n    s.y+=(Math.sin(s.h)*s.spd+Math.sin(wind.a)*wind.s*s.wnd)*dt;\n    s.tt-=dt;if(s.tt<=0){s.tt=.12;s.tr.push({x:s.x,y:s.y,a:1});}\n    for(const t of s.tr)t.a-=dt*.8;\n    s.tr=s.tr.filter(t=>t.a>0 Y+120]])nodes.push({x,y,px:x,py:y,sx:x,sy:y,fix:1});\n mkLayers();ui()}\nfunction mkLayers(){const mk=f=>{const c=document.createElement('canvas');c.width=W;c.height=H;f(c.getContext('2d'));return c};\n sky=mk(q=>{let a=q.createLinearGradient(0,0,0,H*.7);a.addColorStop(0,'#a4cfe0');a.addColorStop(1,'#f5ecc8');q.fillStyle=a;q.fillRect(0,0,W,H);\n  a=q.createRadialGradient(780,80,4,780,80,150);a.addColorStop(0,'rgba(255,248,214,1)');a.addColorStop(.3,'rgba(255,236,170,.7)');a.addColorStop(1,'rgba(255,236,170,0)');q.fillStyle=a;q.fillRect(0,0,W,H);\n  for(const[c,b,m,f,o]of[['#b9c9c4',250,60,.007,1],['#9db5ae',290,45,.01,4],['#86a396',320,28,.014,2]]){q.fillStyle=c;q.beginPath();q.moveTo(0,H);for(let x=0;x<=W;x+=8)q.lineTo(x,b-Math.abs(Math.sin(x*f+o))*m-Math.sin(x*f*3)*8);q.lineTo(W,H);q.fill()}a=q.createLinearGradient(0,340,0,H);a.addColorStop(0,'#a3c8d2');a.addColorStop(1,'#5f8fa3');q.fillStyle=a;q.fillRect(0,340,W,H-340);q.fillStyle='rgba(255,255,255,.25)';q.fillRect(0,340,W,2)});\n cliff=mk(q=>{const side=(x0,x1)=>{const a=q.createLinearGradient(0,L.GY,0,H);a.addColorStop(0,'#a8926e');a.addColorStop(1,'#6e5c46');q.fillStyle=a;q.fillRect(x0,L.GY,x1-x0,H-L.GY);\n  q.strokeStyle='rgba(60,45,30,.25)';q.lineWidth=2;for(let y=L.GY+30;y<H;y+=26+Math.random()*10){q.beginPath();q.moveTo(x0,y);for(let x=x0;x<=x1;x+=20)q.lineTo(x,y+Math.sin(x*.05+y)*3);q.stroke()}\n  for(let i=0;i<40;i++){q.fillStyle=`rgba(${Math.random()<.5?'255,240,210':'60,45,30'},.12)`;q.fillRect(rnd(x0,x1-14),rnd(L.GY+10,H-12),rnd(8,26),rnd(5,12))}\n  q.fillStyle='#6f9a55';q.beginPath();q.moveTo(x0,L.GY-12);for(let x=x0;x<=x1;x+=10)q.lineTo(x,L.GY-10+Math.sin(x*.2)*2);q.lineTo(x1,L.GY+8);q.lineTo(x0,L.GY+8);q.fill();\n  q.fillStyle='#5a8447';q.fillRect(x0,L.GY+4,x1-x0,6)};\n  side(0,L.LX);side(L.RX,W);\n  const tree=(x,s)=>{q.fillStyle='#6b4e2d';q.fillRect(x-3*s,L.GY-18*s,6*s,18*s);for(let i=0;i<3;i++){q.fillStyle=['#4c7a45','#5a8a4f','#679a58'][i];q.beginPath();q.moveTo(x,L.GY-70*s+i*16*s);q.lineTo(x+(18+i*7)*s,L.GY-18*s+i*2);q.lineTo(x-(18+i*7)*s,L.GY-18*s+i*2);q.fill()}};\n  for(let x=30;x<L.LX-30;x+=rnd(50,90))tree(x,rnd(.8,1.3));for(let x=L.RX+40;x<W-20;x+=rnd(50,90))tree(x,rnd(.8,1.3))});\n clouds=[...Array(4)].map(()=>({x:rnd(0,W),y:rnd(30,130),s:rnd(.7,1.2),v:rnd(5,12)}))}\nconst cost=b=>Math.round(b.L/20*PR[b.t]),piers=()=>nodes.filter(n=>n.pier),spent=()=>beams.reduce((s,b)=>s+cost(b),0)+piers().length*PR[5];\nconst near=(x,y)=>nodes.find(n=>Math.hypot(n.x-x,n.y-y)<14);\nfunction snap(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,n=near(x,y);if(n)return{n,x:n.x,y:n.y};\n const sx=Math.round(x/20)*20,sy=Math.round(y/20)*20;if(sx<=L.LX||sx>=L.RX||sy<100||sy>440)return null;const m=near(sx,sy);return m?{n:m,x:m.x,y:m.y}:{x:sx,y:sy}}\nfunction say(m){msg=m;tmsg=2.5}\nfunction addBeam(a,b){const len=Math.hypot(a.x-b.x,a.y-b.y);if(len<20)return;if(len>MAXL)return say('Kiriş en fazla '+MAXL+' birim olabilir.');\n if(a.n&&b.n&&beams.some(k=>(k.a===a.n&&k.b===b.n)||(k.a===b.n&&k.b===a.n)))return;\n const c=Math.round(len/20*PR[tool]);if(spent()+c>L.budget)return say('Bütçe yetmiyor!');\n const nw=[],mkn=p=>{if(p.n)return p.n;const n={x:p.x,y:p.y,px:p.x,py:p.y,sx:p.x,sy:p.y};nodes.push(n);nw.push(n);return n};\n const A=mkn(a),B=mkn(b);const bm={a:A,b:B,t:tool,L:len,dead:0,s:0};beams.push(bm);hist.push({bm,nw})}\nfunction placePier(e){const r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*W/r.width/20)*20;\n if(x<=L.LX+20||x>=L.RX-20)return say('Temel denize kurulmalı.');if(piers().length>=2)return say('En fazla 2 temel kurabilirsin.');if(near(x,420))return;\n if(spent()+PR[5]>L.budget)return say('Bütçe yetmiyor!');const n={x,y:420,px:x,py:420,sx:x,sy:420,fix:1,pier:1};nodes.push(n);hist.push({pier:n})}\nfunction undo(){if(mode!=='build'||!hist.length)return;const h=hist.pop();if(h.pier){nodes.splice(nodes.indexOf(h.pier),1);return}beams.splice(beams.indexOf(h.bm),1);for(const n of h.nw)nodes.splice(nodes.indexOf(n),1)}\nfunction clearAll(){if(mode!=='build')return;while(hist.length)undo()}\nfunction surf(x){if(x<=L.LX||x>=L.RX)return{y:L.GY-10};let best=null;for(const b of beams){if(b.t||b.dead)continue;const x0=Math.min(b.a.x,b.b.x),x1=Math.max(b.a.x,b.b.x);if(x<x0||x>x1||x1-x0<1)continue;const k=(x-b.a.x)/(b.b.x-b.a.x),y=b.a.y+(b.b.y-b.a.y)*k-9;if(!best||y<best.y)best={y,b,k}}return best}\nfunction test(){if(mode!=='build')return;mode='test';tt=0;for(const n of nodes){n.sx=n.x;n.sy=n.y;n.px=n.x;n.py=n.y}\n car={x:L.LX-90,w:[{x:0,y:L.GY-10,vy:0},{x:0,y:L.GY-10,vy:0}],fall:0,rot:0};ov.innerHTML='';ui()}\nfunction reset(){for(const n of nodes){n.x=n.px=n.sx;n.y=n.py=n.sy}for(const b of beams){b.dead=0;b.s=0}car=null;pts=[];mode='build';ov.innerHTML='';ui()}\nfunction burst(x,y,c,n,v){for(let i=0;i<n;i++)pts.push({x,y,vx:rnd(-v,v),vy:rnd(-v*1.2,-10),l:rnd(.5,1.1),c})}\nfunction sim(dt){\n for(const n of nodes)if(!n.fix){const vx=(n.x-n.px)*.992,vy=(n.y-n.py)*.992;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+900*dt*dt}\n if(car&&!car.fall)for(const w of car.w){const s=surf(w.x);if(s&&s.b){const f=4000*L.load*dt*dt,b=s.b;if(!b.a.fix)b.a.y+=f*(1-s.k);if(!b.b.fix)b.b.y+=f*s.k}}\n for(let it=0;it<32;it++){for(const b of beams){if(b.dead)continue;const dx=b.b.x-b.a.x,dy=b.b.y-b.a.y,d=Math.hypot(dx,dy)||1,st=(d-b.L)/b.L;\n  if(it===0){b.s=b.s*.9+st*.1;if(Math.abs(b.t===4?Math.max(0,b.s):b.s)>LIM[b.t]){b.dead=1;burst((b.a.x+b.b.x)/2,(b.a.y+b.b.y)/2,b.t==2?'#9aa4ad':b.t==3?'#c9703f':b.t==4?'#a58553':'#b78a52',9,90);continue}}\n  if(b.t===4&&d<b.L)continue;const k=(d-b.L)/d,wa=b.a.fix?0:1,wb=b.b.fix?0:1,sw=wa+wb;if(!sw)continue;\n  b.a.x+=dx*k*wa/sw;b.a.y+=dy*k*wa/sw;b.b.x-=dx*k*wb/sw;b.b.y-=dy*k*wb/sw}}}\nfunction upd(dt){T+=dt;tmsg-=dt;\n for(const p of pts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}pts=pts.filter(p=>p.l>0);\n if(mode!=='test')return;tt+=dt;sim(1/120);sim(1/120);\n if(!car.fall){car.x+=70*dt;car.rot+=70*dt/10;const[r,f]=car.w;r.x=car.x-20;f.x=car.x+20;const sr=surf(r.x),sf=surf(f.x);\n  if(sf&&sr){r.y=sr.y;f.y=sf.y}else{car.fall=1;r.vy=f.vy=0}}\n else for(const w of car.w){w.vy+=900*dt;w.y+=w.vy*dt;if(w.y>L.WY-10&&!car.sp){car.sp=1;burst(car.x,L.WY,'#d6ecf2',22,120)}}\n if(car.fall&&car.w[0].y>H+40)end(false);else if(car.x>L.RX+70)end(true);else if(tt>40)end(false)}\nfunction end(win){mode=win?'won':'lost';\n if(win){const st=starOf(spent(),L.budget);stars[L.n]=Math.max(stars[L.n]||0,st);try{localStorage.setItem('kopruStars',JSON.stringify(stars))}catch(e){}if(L.n>done){done=L.n;try{localStorage.setItem('kopruDone',done)}catch(e){}}menu('Köprü sağlam! Bölüm '+L.n+' tamam: <b style=\"color:#c9962a;font-size:1.3em\">'+'★'.repeat(st)+'☆'.repeat(3-st)+'<\/b> (harcanan: '+spent()+' / '+L.budget+')');return}\n ov.innerHTML='<div class=\"p\"><h1>Köprü Çöktü<\/h1><p>Kamyon karşıya geçemedi. Üçgenlerle sağlamlaştır, gerilen kirişleri çelikle değiştir.<\/p><button onclick=\"reset()\">Köprüyü Düzenle<\/button> <button class=\"alt\" onclick=\"menu()\">Menü<\/button><\/div>'}\nfunction start(n){level(n);ov.innerHTML=''}\nfunction menu(m){const u=Math.min(99,done+1);level(u);mode='menu';let h='';for(let i=1;i<=99;i++)h+=`<button class=\"${i<=done?'dn':''}\" ${i>u?'disabled':''} onclick=\"start(${i})\">${i}${i<=done?'<br><small>'+'★'.repeat(stars[i]||1)+'<\/small>':''}<\/button>`;\n ov.innerHTML=`<div class=\"p\" style=\"width:min(92%,560px)\"><h1>🌉 Köprü Ustası<\/h1><p>${m||'Bir bölüm seç. Köprüden bir kamyon geçecek; köprü kamyonu taşırsa bölüm biter.'}<\/p><p><small>Bütçenin %55 veya daha azını harcarsan 3 yıldız, %80 veya azını harcarsan 2 yıldız alırsın. Toplam yıldız: ${stars.reduce((a,b)=>a+(b||0),0)}. Fareyle bir noktadan diğerine sürükleyerek kiriş çiz. Malzemeyi seç: tahta ucuz ve zayıf, demir pahalı ve sağlam, bakır ortada, ip çok ucuz ama sadece çekmeye dayanır. Yol kalasları zemindir.<\/small><\/p><div id=\"gr\">${h}<\/div><\/div>`}\nfunction ui(){for(let i=0;i<6;i++)document.getElementById('t'+i).className=i===tool?'sel
