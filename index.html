Item(\"kk_best\")||0}catch(e){}\nconst $=id=>document.getElementById(id);\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction pickWeighted(){let r=Math.random()*100;for(let i=0;i<5;i++){if((r-=WEIGHT[i])<0)return i}return 0}\nfunction makeTicket(){\n  if(Math.random()<0.3){\n    const w=pickWeighted();\n    const o=shuffle([0,1,2,3,4].filter(i=>i!==w)).slice(0,3);\n    return shuffle([w,w,w,...o]);\n  }\n  const t=shuffle([0,1,2,3,4]).slice(0,3);\n  return shuffle([...t,...t]);\n}\nfunction render(){\n  $(\"bal\").textContent=bal+\" ₺\";$(\"best\").textContent=best+\" ₺\";\n  document.querySelectorAll(\".item\").forEach((b,i)=>b.disabled=active||bal<TYPES[i].c);\n}\nfunction buildMenu(){\n  const box=$(\"items\");\n  TYPES.forEach((t,i)=>{\n    const b=document.createElement(\"button\");\n    b.className=\"item\";b.style.setProperty(\"--bc\",t.bd);\n    b.innerHTML=t.n+\" – \"+t.c+\" ₺<span>Ödül: \"+SYM[0][1]*t.m+\" – \"+SYM[4][1]*t.m+\" ₺<\/span>\";\n    b.onclick=()=>buy(t);box.appendChild(b);\n  });\n}\nfunction buy(t){\n  if(active||bal<t.c)return;\n  bal-=t.c;cur=t;\n  symbols=makeTicket();revealed=0;active=true;\n  const slot=$(\"slot\");\n  slot.innerHTML='<div class=\"ticket\" style=\"--tc:'+t.bg+';--tb:'+t.bd+'\"><h2>'+t.n.toUpperCase()+' KAZI KAZAN<\/h2><div class=\"grid\" id=\"grid\"><\/div><\/div>';\n  const g=$(\"grid\");cells=[];\n  symbols.forEach(s=>{\n    const d=document.createElement(\"div\");d.className=\"cell\";\n    d.innerHTML=\"<span>\"+SYM[s][0]+\"<\/span>\";\n    const c=document.createElement(\"canvas\");d.appendChild(c);g.appendChild(d);\n    cells.push({d,c,done:false,s});\n  });\n  requestAnimationFrame(()=>cells.forEach(setupCell));\n  $(\"msg\").className=\"msg\";$(\"msg\").textContent=\"Gümüş kısmı kazı!\";\n  $(\"all\").disabled=false;render();\n}\nfunction setupCell(cell){\n  const c=cell.c,w=c.clientWidth,h=c.clientHeight;\n  c.width=w;c.height=h;\n  const x=c.getContext(\"2d\");\n  const gr=x.createLinearGradient(0,0,w,h);\n  gr.addColorStop(0,\"#c9ced6\");gr.addColorStop(.5,\"#8e96a3\");gr.addColorStop(1,\"#bfc5ce\");\n  x.fillStyle=gr;x.fillRect(0,0,w,h);\n  x.fillStyle=\"rgba(255,255,255,.25)\";\n  for(let i=0;i<40;i++)x.fillRect(Math.random()*w,Math.random()*h,2,2);\n  x.fillStyle=\"#5d6572\";x.font=\"bold \"+Math.round(w*.3)+\"px system-ui\";x.textAlign=\"center\";x.textBaseline=\"middle\";\n  x.fillText(\"?\",w/2,h/2);\n  let down=false,lx=0,ly=0;\n  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};\n  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);scratch(x,lx,ly,lx,ly)};\n  c.onpointermove=e=>{if(!down)return;const[px,py]=pos(e);scratch(x,lx,ly,px,py);lx=px;ly=py};\n  c.onpointerup=c.onpointercancel=()=>{down=false;check(cell)};\n}\nfunction scratch(x,a,b,p,q){\n  x.globalCompositeOperation=\"destination-out\";\n  x.lineWidth=26;x.lineCap=\"round\";x.beginPath();x.moveTo(a,b);x.lineTo(p,q);x.stroke();\n}\nfunction check(cell){\n  if(cell.done)return;\n  const c=cell.c,d=c.getContext(\"2d\").getImageData(0,0,c.width,c.height).data;\n  let clear=0,n=0;\n  for(let i=3;i<d.length;i+=16){n++;if(d[i]===0)clear++}\n  if(clear/n>.5)reveal(cell);\n}\nfunction reveal(cell){\n  if(cell.done)return;\n  cell.done=true;cell.c.remove();revealed++;\n  if(revealed===6)finish();\n}\nfunction finish(){\n  active=false;\n  const cnt={};symbols.forEach(s=>cnt[s]=(cnt[s]||0)+1);\n  const w=Object.keys(cnt).find(k=>cnt[k]>=3);\n  const m=$(\"msg\");\n  if(w!==undefined){\n    const prize=SYM[w][1]*cur.m;bal+=prize;\n    if(prize>best){best=prize;try{localStorage.setItem(\"kk_best\",best)}catch(e){}}\n    cells.forEach(c=>{if(c.s==w)c.d.classList.add(\"win\")});\n    m.className=\"msg win\";m.textContent=\"🎉 \"+SYM[w][0]+\" ×3 → \"+prize+\" ₺ kazandın!\";\n  }else{\n    m.className=\"msg\";m.textContent=\"Bu sefer olmadı, bir tane daha dene!\";\n  }\n  if(bal<TYPES[0].c)m.textContent+=\" Paran bitti, menüden para ekle.\";\n  $(\"all\").disabled=true;render();\n}\n$(\"all\").onclick=()=>{if(active)cells.forEach(reveal)};\n$(\"add\").onclick=()=>{bal+=50;render()};\n$(\"pay\").innerHTML=\"Ödül (bilet fiyatının katı):<br>🍒 2× · 🍋 3× · 🔔 5× · ⭐ 10× · 💎 50×\";\nbuildMenu();render();\n<\/script>\n<\/body>\n<\/html>\n"};/*G_END*/

const ESC="addEventListener('keydown',function(e){if(e.code==='Escape'||e.key==='Escape'){try{parent.postMessage('wg-exit','*')}catch(_){}}},true);";
const inject=h=>h.replace('</head>','<script>window.WG_ESC='+JSON.stringify(ESC)+';'+ESC+'<\/script></head>');
const nz=s=>s.toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const $=id=>document.getElementById(id);
const CATS=['Hepsi','Aksiyon','Arcade','Bulmaca','Strateji','Spor','Simülasyon','2 Kişilik'];
const PLAY='<svg viewBox="0 0 24 24" width="16" height="16"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
let cat='Hepsi',az=false,fr=null,last=null,tt=0,sel=0;const tiles={};
function mk(g,size){const b=document.createElement('button');b.className='t '+(size||g.s);b.dataset.g=g.id;b.setAttribute('aria-label',g.n+' oyna');
 b.innerHTML='<img src="'+IMG[g.id]+'" alt="" draggable="false">'+(g.nw?'<span class="nw">YENİ</span>':'')+'<span class="pl">'+PLAY+'</span><span class="lb">'+g.n+'<small>'+g.c.join(' · ')+'</small></span>';
 b.addEventListener('click',()=>openGame(g.id,b));return b}
function build(){GM.forEach(g=>{tiles[g.id]=mk(g)});
 $('chips').innerHTML=CATS.map(c=>'<button class="chip" data-c="'+c+'">'+c+'<i>'+(c==='Hepsi'?GM.length:GM.filter(g=>g.c.includes(c)).length)+'</i></button>').join('');
 $('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;render()}});render();recent()}
const match=g=>{const q=nz($('q').value.trim());return(cat==='Hepsi'||g.c.includes(cat))&&(!q||nz(g.n+' '+g.c+' '+g.k+' '+g.d).includes(q))};
function render(){let n=0;const list=GM.slice();if(az)list.sort((a,b)=>a.n.localeCompare(b.n,'tr'));
 list.forEach(g=>{const t=tiles[g.id];$('grid').appendChild(t);const ok=match(g);t.hidden=!ok;if(ok)n++});
 $('none').style.display=n?'none':'block';$('cnt').textContent=n+' OYUN';$('sort').textContent=az?'SIRA':'A–Z';
 $('clr').style.display=$('q').value?'block':'none';
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.c===cat))}
function drop(){const q=nz($('q').value.trim()),box=$('drop');if(!q){box.classList.remove('on');return}
 const m=GM.filter(g=>nz(g.n+' '+g.c+' '+g.k).includes(q)).slice(0,6);sel=0;box._m=m;
 box.innerHTML=m.length?m.map((g,i)=>'<div class="dr'+(i?'':' sel')+'" data-g="'+g.id+'"><img src="'+IMG[g.id]+'" alt=""><div><b>'+g.n+'</b><span>'+g.c.join(' · ')+' · '+g.d.split('. ')[0]+'</span></div></div>').join(''):'<div class="dr"><div><b>Sonuç yok</b><span>Başka bir kelime dene</span></div></div>';
 box.classList.add('on')}
function recent(){let r=[];try{r=JSON.parse(localStorage.getItem('wg_recent')||'[]')}catch(e){}
 r=r.filter(id=>IMG[id]).slice(0,6);const row=$('recrow');row.innerHTML='';$('rec').style.display=r.length?'block':'none';
 r.forEach(id=>{const g=GM.find(x=>x.id===id);if(g)row.appendChild(mk(g,'s'))})}
function remember(id){try{let r=JSON.parse(localStorage.getItem('wg_recent')||'[]').filter(x=>x!==id);r.unshift(id);localStorage.setItem('wg_recent',JSON.stringify(r.slice(0,8)))}catch(e){}}
function openGame(id,el){
 if(fr)return;last=el;$('drop').classList.remove('on');remember(id);
 const pl=$('player'),toast=$('toast');
 fr=document.createElement('iframe');fr.title=id;fr.allow='autoplay; fullscreen';fr.srcdoc=inject(G[id]);
 fr.onload=()=>{try{fr.contentWindow.focus()}catch(e){}};
 pl.insertBefore(fr,pl.firstChild);pl.classList.add('on');document.body.classList.add('lock');
 toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3200);
 setTimeout(()=>{try{fr.focus();fr.contentWindow.focus()}catch(e){}},50)}
function closeGame(){if(!fr)return;fr.remove();fr=null;$('player').classList.remove('on');document.body.classList.remove('lock');$('toast').classList.remove('on');recent();window.focus();if(last&&document.contains(last))last.focus()}
const q=$('q');
q.addEventListener('input',()=>{render();drop()});
q.addEventListener('focus',drop);
q.addEventListener('keydown',e=>{const m=$('drop')._m||[],rows=document.querySelectorAll('.dr');
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!m.length)return;sel=(sel+(e.key==='ArrowDown'?1:m.length-1))%m.length;rows.forEach((r,i)=>r.classList.toggle('sel',i===sel))}
 else if(e.key==='Enter'){const g=m[sel]||GM.find(match);if(g){e.preventDefault();q.blur();openGame(g.id,tiles[g.id])}}
 else if(e.key==='Escape'){q.value='';render();drop();q.blur()}});
$('drop').addEventListener('mousedown',e=>{const r=e.target.closest('.dr[data-g]');if(r){e.preventDefault();openGame(r.dataset.g,tiles[r.dataset.g])}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('drop').classList.remove('on')});
$('clr').addEventListener('click',()=>{q.value='';render();drop();q.focus()});
$('sort').addEventListener('click',()=>{az=!az;render()});
$('brand').addEventListener('click',()=>{q.value='';cat='Hepsi';az=false;render();drop();scrollTo({top:0,behavior:'smooth'})});
$('back').addEventListener('click',closeGame);
addEventListener('message',e=>{if(e.data==='wg-exit')closeGame()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeGame();else if(e.key==='/'&&!fr&&document.activeElement!==q){e.preventDefault();q.focus()}});
// Eski sürümdeki hesap verilerini oyunların kendi kayıtlarına bir kez geri taşır (veri silinmez)
try{if(!localStorage.getItem('wg:mig')){const U=JSON.parse(localStorage.getItem('wg:users')||'{}'),ems=Object.keys(U);
 const em=U[localStorage.getItem('wg:session')]?localStorage.getItem('wg:session'):(ems.length===1?ems[0]:null);
 if(em&&U[em]&&U[em].id){const P='wg:d:'+U[em].id+':',ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0)ks.push(k)}ks.forEach(k=>localStorage.setItem(k.slice(P.length),localStorage.getItem(k)))}
 if(em||!ems.length)localStorage.setItem('wg:mig','1')}}catch(e){}
build();
</script>
